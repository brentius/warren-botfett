[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warren-botfett"
version = "0.1.0"
description = "A modular, open-source quantitative trading framework for prediction markets and equities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
polymarket = ["py-clob-client>=0.17"]
kalshi = []
equities = ["alpaca-py>=0.30"]
research = ["pandas>=2.2", "numpy>=1.26", "jupyter"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
botfett = "warren_botfett.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warren_botfett"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
